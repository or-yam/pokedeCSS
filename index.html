<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedecss</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/webp" href="./ballicon.webp">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to Pokédex</a>

    <header class="mention">
      <p>or-yam</p>
      <nav aria-label="Author profiles">
        <ul class="links">
          <li>
            <a href="https://codepen.io/oryamne" target="_blank" rel="noopener noreferrer" aria-label="CodePen">
              <span class="link-logo codepen" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="https://github.com/or-yam" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <span class="link-logo github" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="https://dev.to/oryam" target="_blank" rel="noopener noreferrer" aria-label="DEV Community">
              <span class="link-logo dev" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/oryamne/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <span class="link-logo linkedin" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content" class="page-content" tabindex="-1">
      <h1 class="visually-hidden">CSS Pokédex</h1>
      <img class="logo" src="logo.png" alt="Pokémon" width="1200" height="442">

      <search>
        <form id="pokemon-search" class="search-container">
          <label class="visually-hidden" for="name-input">Pokémon name or Pokédex number</label>
          <input id="name-input" name="pokemon" type="search" placeholder="Name / id" autocomplete="off">

          <button id="search-btn" class="ball-container" type="submit" aria-label="Search Pokémon">
            <span class="upper-half-ball" aria-hidden="true"></span>
            <span class="bottom-half-ball" aria-hidden="true"></span>
            <span class="center-ball" aria-hidden="true"></span>
            <span class="center-line" aria-hidden="true"></span>
          </button>
        </form>
      </search>

      <p id="result-status" class="visually-hidden" role="status" aria-live="polite"></p>

      <div class="pokedex-container">
        <section id="pokedex" aria-labelledby="pokedex-title">
          <h2 id="pokedex-title" class="visually-hidden">Pokédex entry</h2>
      <!-- Left Panel -->
      <div id="left-panel">
        <!-- Top lights -->
        <div class="left-top-container" aria-hidden="true">
          <svg height="100" width="225" viewBox="0 0 225 100" class="left-svg" focusable="false">
            <polyline points="0,75 70,75 90,38 224,38" />
          </svg>
          <div class="lights-container">
            <div class="big-light-boarder">
              <div class="big-light blue">
                <div class="big-dot light-blue"></div>
              </div>
            </div>
            <div class="small-lights-container">
              <div class="small-light red">
                <div class="dot light-red"></div>
              </div>
              <div class="small-light yellow">
                <div class="dot light-yellow"></div>
              </div>
              <div class="small-light green">
                <div class="dot light-green"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Center Screen -->
        <div class="screen-container">
          <div class="screen">
            <div class="top-screen-lights" aria-hidden="true">
              <div class="mini-light red"></div>
              <div class="mini-light red"></div>
            </div>
            <img
              id="main-screen"
              src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png"
              alt="Bulbasaur"
              width="475"
              height="475"
            >
            <div class="bottom-screen-lights" aria-hidden="true">
              <div class="small-light red">
                <div class="dot light-red"></div>
              </div>
              <div class="burger">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Bottom Buttons -->
        <div class="buttons-container">
          <div class="upper-buttons-container" aria-hidden="true">
            <div class="big-button"></div>
            <div class="long-buttons-container">
              <div class="long-button red"></div>
              <div class="long-button light-blue"></div>
            </div>
          </div>
          <div class="nav-buttons-container">
            <div class="dots-container" aria-hidden="true">
              <div>.</div>
              <div>.</div>
            </div>
            <div class="green-screen">
              <span id="name-screen">bulbasaur</span>
            </div>
            <div class="right-nav-container">
              <div class="nav-button">
                <div class="nav-center-circle"></div>
                <div class="nav-button-vertical"></div>
                <div class="nav-button-horizontal">
                  <button class="left-nav-button" type="button" aria-label="Previous Pokémon"></button>
                  <button class="right-nav-button" type="button" aria-label="Next Pokémon"></button>
                  <div class="border-top"></div>
                  <div class="border-bottom"></div>
                </div>
              </div>
              <div class="bottom-right-nav-container" aria-hidden="true">
                <div class="small-light red">
                  <div class="dot light-red"></div>
                </div>
                <div class="dots-container">
                  <div class="black-dot">.</div>
                  <div class="black-dot">.</div>
                  <div class="black-dot">.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- End of Left panel -->

      <!-- Right-panel -->
      <div id="right-panel">
        <!-- Blank container -->
        <div class="empty-container" aria-hidden="true">
          <svg height="100%" width="100%" viewBox="0 0 228 82" preserveAspectRatio="none" focusable="false">
            <polyline
              points="0,0 0,40 138,40 158,75 250,75 250,0 0,0"
              class="right-panel-fill"
            />
            <polyline points="0,40 138,40 158,75 250,75" class="right-panel-outline" />
          </svg>
        </div>
        <!-- Top screen -->
        <div class="top-screen-container">
          <p id="about-screen" class="right-panel-screen">Height: 70cm Weight: 6.9kg</p>
        </div>
        <!-- Blue Buttons -->
        <div class="square-buttons-container" aria-hidden="true">
          <div class="blue-squares-container">
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
            <div class="blue-square"></div>
          </div>
        </div>
        <!-- Center Buttons -->
        <div class="center-buttons-container" aria-hidden="true">
          <div class="center-left-container">
            <div class="small-reds-container">
              <div class="small-light red">
                <div class="dot light-red"></div>
              </div>
              <div class="small-light red">
                <div class="dot light-red"></div>
              </div>
            </div>
            <div class="white-squares-container">
              <div class="white-square"></div>
              <div class="white-square"></div>
            </div>
          </div>
          <div class="center-right-container">
            <div class="thin-buttons-container">
              <div class="thin-button"></div>
              <div class="thin-button"></div>
            </div>
            <div class="yellow-button yellow">
              <div class="big-dot light-yellow"></div>
            </div>
          </div>
        </div>
        <!-- Bottom screens -->
        <div class="bottom-screens-container">
          <p class="right-panel-screen"><span class="visually-hidden">Type: </span><span id="type-screen">grass</span></p>
          <p class="right-panel-screen">
            <span class="visually-hidden">Pokédex number </span><span id="id-screen">#1</span>
          </p>
        </div>
      </div>
        </section>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
